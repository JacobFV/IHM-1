[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ihm-1"
version = "0.3.0"
description = "Implicit human body model with evidence-conditioned predictor materialization"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
ihm = "ihm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ihm"]

[project.optional-dependencies]
brain = ["torch>=2.6"]
plot = ["matplotlib>=3.8", "trimesh>=5.1.0", "fast-simplification>=0.1"]
data = ["pandas>=2.2", "pyarrow>=16", "pyreadstat>=1.3.6", "pillow>=10"]

[tool.hatch.build.targets.sdist]
include = ["/ihm", "/scripts", "/docs", "/README.md", "/pyproject.toml", "/uv.lock", "/data/examples", "/data/models", "/data/sources", "/data/README.md", "/app/src", "/app/test", "/app/package.json", "/app/package-lock.json", "/app/index.html", "/app/vite.config.js", "/app/playwright.config.js"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
